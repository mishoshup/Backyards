[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/mishoshup/backyards"
rust-version = "1.95"
readme = "README.md"
keywords = ["infrastructure", "sandbox", "agents", "declarative"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
kernel = { path = "crates/kernel", version = "0.0.0" }
manifest = { path = "crates/manifest", version = "0.0.0" }
gardens = { path = "crates/gardens", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
clone_on_ref_ptr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
map_err_ignore = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
rc_mutex = "deny"
wildcard_enum_match_arm = "deny"
option_option = "deny"
unused_self = "deny"
future_not_send = "deny"
unreadable_literal = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
min_ident_chars = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
