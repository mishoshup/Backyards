name: agent-code-review

permissions: {}

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  authorize:
    permissions:
      pull-requests: read
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/agent-review'))
    runs-on: ubuntu-latest
    outputs:
      is_authorized: ${{ steps.gate.outputs.is_authorized }}
    steps:
      - name: Check contributor authorization
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ACTOR_ASSOCIATION: ${{ github.event_name == 'pull_request' && github.event.pull_request.author_association || github.event.comment.author_association }}
        run: |
          head_repository=$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq .head.repo.full_name)
          case "${ACTOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR) is_trusted_actor=true ;;
            *) is_trusted_actor=false ;;
          esac
          if [[ "${is_trusted_actor}" == true && "${head_repository}" == "${REPOSITORY}" ]]; then
            echo "is_authorized=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_authorized=false" >> "${GITHUB_OUTPUT}"
          fi

  review:
    needs: authorize
    if: needs.authorize.outputs.is_authorized == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: agent-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2

      - name: Run the agent review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_COMMENT_BODY: ${{ github.event.comment.body }}
        run: >-
          cargo xtask review pull-request
          --pull-request "${{ github.event.pull_request.number || github.event.issue.number }}"
